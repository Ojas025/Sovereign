name: ci

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'tests/**'
      - 'src/**'
      - 'plugins/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - 'tests/**'
      - 'src/**'
      - 'plugins/**'
      - 'scripts/**'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest -m "not model and not sandbox"
