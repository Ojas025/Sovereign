# Provisioned Prometheus datasource — no click-ops after `workbench obs up`.
# Host networking (M7.7): Grafana reaches Prometheus on the same loopback.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
    uid: prometheus
